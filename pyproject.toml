[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "body_shop_scheduler"
version = "0.1.0"
description = "Rolling-horizon body-shop scheduler for automotive BIW lines with operator assignment, material constraints, and stochastic simulation"
authors = [{name = "Seb"}]
requires-python = ">=3.9"
dependencies = [
    "ortools>=9.0",
    "pandas>=2.0",
    "matplotlib>=3.5",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
